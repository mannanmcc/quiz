<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Quiz</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20260627-user-admin">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🎓 Vocabulary Quiz</div>
        <div class="nav-user">
            <a href="/student/dashboard" class="btn btn-secondary">Back to Dashboard</a>
        </div>
    </nav>

    <div class="debug-badge">QUIZ PAGE V2</div>

    <div class="container">
        <div id="quizContainer">
            <h1 id="quizTitle">Loading...</h1>
            <p id="quizDescription"></p>
            
            <form id="quizForm">
                <div id="questionsContainer"></div>
                <button type="submit" class="btn btn-primary btn-large">Submit Quiz</button>
            </form>
        </div>

        <div id="resultsContainer" style="display: none;">
            <h1>Quiz Results</h1>
            <div class="results-box">
                <h2>Your Score: <span id="finalScore"></span></h2>
                <p id="finalPercentage"></p>
            </div>
            <section id="reportSection">
                <h2>Review Your Answers</h2>
                <div id="reportDetails"></div>
                <div id="reportDebug" class="report-debug"></div>
            </section>
            <a href="/student/dashboard" class="btn btn-primary">Back to Dashboard</a>
        </div>
    </div>

    <script>
        const quizId = "{{.QuizID}}";
        console.log('quiz page loaded v2');
        console.log('submit endpoint', `/student/api/quiz/${quizId}/submit`);

        function questionTypeLabel(type) {
            if (type === 'meaning') return 'Meaning';
            if (type === 'synonym') return 'Synonym';
            if (type === 'antonym') return 'Antonym';
            return 'Question';
        }

        function showLoadError(message) {
            document.getElementById('quizTitle').textContent = 'Unable to load quiz';
            document.getElementById('quizDescription').textContent = message;
            document.getElementById('quizForm').style.display = 'none';
        }

        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderFeedbackReport(report) {
            const reportContainer = document.getElementById('reportDetails');
            const debugContainer = document.getElementById('reportDebug');
            reportContainer.innerHTML = '';
            debugContainer.innerHTML = '';

            if (!Array.isArray(report)) {
                reportContainer.innerHTML = '<p>No answer report available.</p>';
                debugContainer.innerHTML = `<pre>report: ${escapeHTML(JSON.stringify(report, null, 2))}</pre>`;
                return;
            }

            if (report.length === 0) {
                reportContainer.innerHTML = '<p>No answer report available.</p>';
                debugContainer.innerHTML = `<pre>report.length = 0</pre>`;
                return;
            }

            report.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'report-card';
                itemDiv.innerHTML = `
                    <h3>Question ${index + 1}</h3>
                    <p class="report-question">${escapeHTML(item.question_text)}</p>
                    <p><strong>Your answer:</strong> ${escapeHTML(item.selected_answer || 'No answer')}</p>
                    <p><strong>Correct answer:</strong> ${escapeHTML(item.correct_answer)}</p>
                    <p class="report-status ${item.is_correct ? 'correct-answer' : 'incorrect-answer'}">
                        ${item.is_correct ? 'Correct' : 'Incorrect'}
                    </p>
                `;
                reportContainer.appendChild(itemDiv);
            });
        }

        function renderQuestion(q, index) {
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question-card';

            const header = document.createElement('div');
            header.className = 'question-header';

            const number = document.createElement('span');
            number.className = 'question-number';
            number.textContent = `Question ${index + 1}`;

            const type = document.createElement('span');
            type.className = 'question-type';
            type.textContent = questionTypeLabel(q.question_type);

            const points = document.createElement('span');
            points.className = 'question-points';
            points.textContent = `${q.points} point(s)`;

            header.append(number, type, points);

            const title = document.createElement('h3');
            title.textContent = q.question_text;

            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options-container';

            q.options.forEach(option => {
                const label = document.createElement('label');
                label.className = 'option-label';

                const input = document.createElement('input');
                input.type = 'radio';
                input.name = `question_${q.id}`;
                input.value = option;
                input.required = true;

                const text = document.createElement('span');
                text.textContent = option;

                label.append(input, text);
                optionsContainer.appendChild(label);
            });

            questionDiv.append(header, title, optionsContainer);
            return questionDiv;
        }

        async function loadQuiz() {
            try {
                const response = await fetch(`/student/api/quiz/${quizId}`);
                if (!response.ok) {
                    throw new Error(await response.text());
                }

                const data = await response.json();

                document.getElementById('quizTitle').textContent = data.quiz.title;
                document.getElementById('quizDescription').textContent = data.quiz.description || '';

                const container = document.getElementById('questionsContainer');
                container.innerHTML = '';

                if (!data.questions || data.questions.length === 0) {
                    showLoadError('This quiz does not have any questions yet.');
                    return;
                }

                data.questions.forEach((q, index) => {
                    container.appendChild(renderQuestion(q, index));
                });
            } catch (error) {
                console.error('Error loading quiz:', error);
                showLoadError('Please go back to the dashboard and try again.');
            }
        }

        document.getElementById('quizForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const answers = {};

            for (let [key, value] of formData.entries()) {
                const questionId = key.replace('question_', '');
                answers[questionId] = value;
            }

            try {
                const response = await fetch(`/student/api/quiz/${quizId}/submit`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ answers })
                });

                if (!response.ok) {
                    throw new Error(await response.text());
                }

                const result = await response.json();
                console.log('submit result', result);
                if (!Array.isArray(result.report)) {
                    console.warn('Expected result.report to be an array', result.report);
                }

                document.getElementById('quizContainer').style.display = 'none';
                document.getElementById('resultsContainer').style.display = 'block';
                document.getElementById('reportDebug').innerHTML = `<pre>report payload: ${escapeHTML(JSON.stringify(result.report, null, 2))}</pre>`;
                document.getElementById('finalScore').textContent =
                    `${result.score} / ${result.max_score}`;
                document.getElementById('finalPercentage').textContent =
                    `Percentage: ${result.percentage.toFixed(1)}%`;
                renderFeedbackReport(result.report);
            } catch (error) {
                console.error('Error submitting quiz:', error);
                alert('Failed to submit quiz. Please try again.');
            }
        });

        loadQuiz();
    </script>
</body>
</html>

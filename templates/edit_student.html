<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20260728-edit-student">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🎓 QUIZ - Admin</div>
        <div class="nav-user">
            <a href="/admin/dashboard#students" class="btn btn-secondary">Back to Dashboard</a>
            <a href="/logout" class="btn btn-secondary">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1>Edit Student</h1>

        <div class="quiz-builder">
            <form id="adminEditStudentForm" data-student-id="{{.Student.id}}">
                <div class="form-group">
                    <label for="student_fullname">Full Name</label>
                    <input type="text" id="student_fullname" value="{{.Student.full_name}}" required>
                </div>

                <div class="form-group">
                    <label for="student_username">Username</label>
                    <input type="text" id="student_username" value="{{.Student.username}}" required>
                </div>

                <div class="form-group">
                    <label for="student_email">Email</label>
                    <input type="email" id="student_email" value="{{.Student.email}}" required>
                </div>

                <div class="form-group">
                    <label for="student_password">New Password</label>
                    <input type="password" id="student_password" minlength="6" placeholder="Leave blank to keep current password">
                </div>

                <div class="form-group">
                    <label for="student_stage">Stage</label>
                    <select id="student_stage" required>
                        <option value="">Select stage</option>
                        {{range .Stages}}
                        <option value="{{.ID}}" {{if eq .ID $.Student.stage_id}}selected{{end}}>{{.Name}}</option>
                        {{end}}
                    </select>
                </div>

                <label class="checkbox-row">
                    <input type="checkbox" id="student_disabled" {{if .Student.is_disabled}}checked{{end}}>
                    Account disabled
                </label>

                <button type="submit" class="btn btn-primary btn-large">Save Changes</button>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js?v=20260728-edit-student"></script>
</body>
</html>

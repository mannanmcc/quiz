<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Quiz</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🎓 Vocabulary Quiz - Admin</div>
        <div class="nav-user">
            <a href="/admin/dashboard" class="btn btn-secondary">Back to Dashboard</a>
            <a href="/logout" class="btn btn-secondary">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1>Edit Quiz</h1>

        <div class="quiz-builder">
            <form id="editQuizForm" onsubmit="submitQuiz(event, {{.QuizID}})">
                <div class="form-group">
                    <label>Quiz Title</label>
                    <input type="text" name="quiz_title" placeholder="e.g., Vocabulary Test - Level 1" required>
                </div>

                <div class="form-group">
                    <label>Quiz Description</label>
                    <textarea name="quiz_description" rows="3" placeholder="Brief description of the quiz"></textarea>
                </div>

                <hr style="margin: 2rem 0;">

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <h2>Questions</h2>
                    <button type="button" class="btn btn-primary" onclick="addQuestion()">Add Question</button>
                </div>

                <div id="questionsContainer"></div>

                <button type="submit" class="btn btn-primary btn-large">Save Quiz</button>
            </form>
        </div>
    </div>

    <script>
        window.editQuizID = {{.QuizID}};
    </script>
    <script src="/static/js/app.js"></script>
</body>
</html>

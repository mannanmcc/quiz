<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Student</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🎓 Vocabulary Quiz - Admin</div>
        <div class="nav-user">
            <a href="/admin/dashboard" class="btn btn-secondary">Back to Dashboard</a>
            <a href="/logout" class="btn btn-secondary">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1>Register Student</h1>

        <div class="quiz-builder">
            <form id="adminCreateStudentForm">
                <div class="form-group">
                    <label for="student_fullname">Full Name</label>
                    <input type="text" id="student_fullname" required>
                </div>

                <div class="form-group">
                    <label for="student_username">Username</label>
                    <input type="text" id="student_username" required>
                </div>

                <div class="form-group">
                    <label for="student_password">Password</label>
                    <input type="password" id="student_password" required>
                </div>

                <div class="form-group">
                    <label for="student_stage">Stage</label>
                    <select id="student_stage" required>
                        <option value="">Select stage</option>
                        {{range .Stages}}
                        <option value="{{.ID}}">{{.Name}}</option>
                        {{end}}
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-large">Register Student</button>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🎓 Vocabulary Quiz - Admin</div>
        <div class="nav-user">
            <a href="/admin/quiz/create" class="btn btn-primary">Create New Quiz</a>
            <a href="/logout" class="btn btn-secondary">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="admin-header">
            <h1>Manage Quizzes</h1>
        </div>

        <div class="quiz-grid">
            {{range .Quizzes}}
            <div class="quiz-card">
                <h3>{{.title}}</h3>
                <p>{{.description}}</p>
                <p class="quiz-date">Created: {{.created_at}}</p>
                <p class="quiz-date">By: {{.created_by}}</p>
                <p class="quiz-date">Lock after completion: {{if .lock_after_attempt}}Yes{{else}}No{{end}}</p>
                <a class="btn btn-primary" href="/admin/quiz/{{.id}}/edit">Edit Questions</a>
                <button class="btn btn-primary" onclick="loadResults({{.id}})">View Results</button>
                <button class="btn btn-primary" onclick="loadProgressReport({{.id}})">Progress Report</button>
                {{if .lock_after_attempt}}
                <button class="btn btn-secondary" onclick="resetQuiz({{.id}})">Unlock Exam</button>
                {{end}}
            </div>
            {{end}}
        </div>

        <div id="resultsContainer" style="margin-top: 3rem;"></div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>

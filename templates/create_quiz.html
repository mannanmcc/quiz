<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20260628-remove-debug-badge">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🎓 QUIZ - Admin</div>
        <div class="nav-user">
            <a href="/admin/dashboard" class="btn btn-secondary">Back to Dashboard</a>
            <a href="/logout" class="btn btn-secondary">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1>Create New Quiz</h1>

        <div class="quiz-builder">
            <form id="createQuizForm" onsubmit="submitQuiz(event)">
                <div class="form-group">
                    <label>Quiz Title</label>
                    <input type="text" name="quiz_title" placeholder="e.g., Vocabulary Test - Level 1" required>
                </div>

                <div class="form-group">
                    <label>Quiz Description</label>
                    <textarea name="quiz_description" rows="3" placeholder="Brief description of the quiz"></textarea>
                </div>

                <div class="form-group">
                    <label>Stage</label>
                    <select name="stage_id" required>
                        <option value="">Select stage</option>
                        {{range .Stages}}
                        <option value="{{.ID}}">{{.Name}}</option>
                        {{end}}
                    </select>
                </div>

                <div class="form-group">
                    <label>Time Limit (minutes)</label>
                    <input type="number" name="time_limit_minutes" min="0" value="0" placeholder="0 means no timer">
                </div>

                <label class="checkbox-row">
                    <input type="checkbox" name="do_not_lock_after_attempt">
                    <span>Do not lock exam after completion</span>
                </label>

                <hr style="margin: 2rem 0;">

                <div style="margin-bottom: 2rem;">
                    <h2>Questions</h2>
                </div>

                <div id="questionsContainer"></div>

                <button type="button" class="btn btn-primary" onclick="addQuestion()" style="margin-bottom: 1rem;">Add Question</button>
                <button type="submit" class="btn btn-primary btn-large">Create Quiz</button>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js?v=20260628-remove-debug-badge"></script>
</body>
</html>

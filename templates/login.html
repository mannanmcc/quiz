<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vocabulary Quiz</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20260628-remove-debug-badge">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>🎓 Vocabulary Quiz</h1>
            <h2>Login</h2>
            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <div class="register-link">
                <p>New student? <a href="#" id="showRegister">Register here</a></p>
            </div>
        </div>

        <div class="register-box" id="registerBox" style="display: none;">
            <h2>Register New Student</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="reg_fullname">Full Name</label>
                    <input type="text" id="reg_fullname" required>
                </div>
                <div class="form-group">
                    <label for="reg_username">Username</label>
                    <input type="text" id="reg_username" required>
                </div>
                <div class="form-group">
                    <label for="reg_password">Password</label>
                    <input type="password" id="reg_password" required>
                </div>
                <div class="form-group">
                    <label for="reg_stage">Stage</label>
                    <select id="reg_stage" required>
                        <option value="">Select stage</option>
                        {{range .Stages}}
                        <option value="{{.ID}}">{{.Name}}</option>
                        {{end}}
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
                <button type="button" class="btn btn-secondary" id="cancelRegister">Cancel</button>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js?v=20260628-remove-debug-badge"></script>
</body>
</html>

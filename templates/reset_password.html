<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - QUIZ</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20260704-email-reset">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>🎓 QUIZ</h1>
            <h2>Reset Password</h2>
            {{if .Error}}
            <div class="login-error" role="alert">
                <strong>Reset failed</strong>
                <span>{{.Error}}</span>
            </div>
            {{end}}
            {{if .Success}}
            <div class="alert alert-success" role="status">
                {{.Success}}
            </div>
            <a href="/login" class="btn btn-primary btn-large">Back to Login</a>
            {{else}}
            <form action="/reset-password" method="POST">
                <input type="hidden" name="token" value="{{.Token}}">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary btn-large">Reset Password</button>
            </form>
            <div class="register-link">
                <p><a href="/login">Back to login</a></p>
            </div>
            {{end}}
        </div>
    </div>
</body>
</html>
